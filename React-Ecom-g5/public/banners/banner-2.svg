<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg2)" rx="24" />

  <circle cx="1000" cy="180" r="190" fill="#fb7185" opacity="0.3" filter="url(#glow2)" />
  <circle cx="750" cy="350" r="150" fill="#f43f5e" opacity="0.25" filter="url(#glow2)" />
  <circle cx="250" cy="380" r="130" fill="#9f1239" opacity="0.4" filter="url(#glow2)" />

  <!-- Diagonal Stripe Accent -->
  <path d="M 700 -50 L 1300 -50 L 1100 550 L 500 550 Z" fill="#ffffff" opacity="0.04" />
  <path d="M 850 -50 L 1350 -50 L 1250 550 L 750 550 Z" fill="#ffffff" opacity="0.03" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="165" height="34" rx="17" fill="url(#goldGrad)" />
    <text x="82" y="22" fill="#881337" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">NEW SEASON</text>

    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Summer Trends</text>
    <text x="0" y="135" fill="url(#goldGrad)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">&amp; Fashion Styles</text>

    <text x="0" y="180" fill="#fecdd3" font-size="16" font-family="system-ui, -apple-system, sans-serif">Upgrade your wardrobe with timeless looks and trendy apparel.</text>

    <rect x="0" y="215" width="160" height="46" rx="8" fill="#ffffff" />
    <text x="80" y="244" fill="#881337" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">VIEW STYLES →</text>
  </g>

  <!-- Right Visual Graphics -->
  <g transform="translate(900, 240)">
    <!-- Hanger & Shopping Bag Art -->
    <circle cx="0" cy="0" r="140" fill="#ffffff" opacity="0.07" />
    <circle cx="0" cy="0" r="100" fill="#ffffff" opacity="0.09" />
    <!-- Shopping bag silhouette -->
    <rect x="-65" y="-40" width="130" height="120" rx="16" fill="#ffe4e6" opacity="0.9" />
    <!-- Bag Handle -->
    <path d="M -30 -40 C -30 -85, 30 -85, 30 -40" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round" />
    <!-- Star Tag on bag -->
    <polygon points="0,5 5,18 19,18 8,26 12,39 0,31 -12,39 -8,26 -19,18 -5,18" fill="#e11d48" />

    <!-- Tag Badge -->
    <g transform="translate(70, -70)">
      <circle cx="0" cy="0" r="42" fill="url(#goldGrad)" />
      <text x="0" y="-5" fill="#881337" font-size="12" font-weight="900" text-anchor="middle" font-family="sans-serif">HOT DEAL</text>
      <text x="0" y="16" fill="#881337" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">50%</text>
    </g>
  </g>
</svg>
