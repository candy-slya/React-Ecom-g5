<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFootwear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glowFootwear" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgFootwear)" rx="24" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="220" r="190" fill="#f97316" opacity="0.3" filter="url(#glowFootwear)" />
  <circle cx="750" cy="380" r="140" fill="#ef4444" opacity="0.25" filter="url(#glowFootwear)" />
  <circle cx="200" cy="140" r="130" fill="#f59e0b" opacity="0.15" filter="url(#glowFootwear)" />

  <!-- Dynamic Motion Speed Stripes -->
  <path d="M 620 -40 L 760 -40 L 640 520 L 500 520 Z" fill="#ffffff" opacity="0.03" />
  <path d="M 780 -40 L 920 -40 L 800 520 L 660 520 Z" fill="#ffffff" opacity="0.04" />
  <path d="M 940 -40 L 1080 -40 L 960 520 L 820 520 Z" fill="#ffffff" opacity="0.02" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#orangeGrad)" />
    <text x="90" y="22" fill="#ffffff" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">PREMIUM FOOTWEAR</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Step Into Pure Comfort</text>
    <text x="0" y="135" fill="url(#amberGold)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">&amp; Modern Sneakers</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#d4d4d8" font-size="16" font-family="system-ui, -apple-system, sans-serif">Explore iconic sneakers, running shoes, and all-day comfortable footwear.</text>

    <!-- Button -->
    <rect x="0" y="215" width="165" height="46" rx="10" fill="#ffffff" />
    <text x="82" y="244" fill="#18181b" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SHOP NOW →</text>
  </g>

  <!-- Right Visual Graphics: Modern Athletic Sneaker Silhouette -->
  <g transform="translate(890, 240)">
    <!-- Speed Motion Rings -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
    <circle cx="0" cy="0" r="115" fill="#ffffff" opacity="0.04" />

    <!-- Sneaker Silhouette Art -->
    <!-- Outsole Cushion Base -->
    <path d="M -110 50 C -70 50, -40 45, 0 45 C 50 45, 90 40, 130 55 C 135 57, 140 50, 135 40 C 120 15, 95 -10, 65 -25 L 30 -50 C 25 -55, 10 -45, -5 -30 L -50 0 C -70 10, -90 15, -115 25 C -125 30, -125 50, -110 50 Z" fill="#ffffff" opacity="0.95" />
    <!-- Midsole Accent Layer -->
    <path d="M -115 40 C -70 42, -40 37, 0 37 C 50 37, 90 32, 130 45 C 133 46, 135 42, 132 35 C 120 18, 95 0, 70 -15 L 35 -38 C 32 -42, 22 -35, 10 -25 L -45 5 C -65 15, -85 20, -112 30 C -120 33, -120 39, -115 40 Z" fill="url(#orangeGrad)" />
    <!-- Dynamic Swoop Stripe -->
    <path d="M -60 15 Q 0 -15 60 5 Q 0 0 -60 15 Z" fill="#ffffff" />

    <!-- Traction Dots on Sole -->
    <circle cx="-80" cy="45" r="3" fill="#ea580c" />
    <circle cx="-50" cy="42" r="3" fill="#ea580c" />
    <circle cx="-20" cy="42" r="3" fill="#ea580c" />
    <circle cx="10" cy="42" r="3" fill="#ea580c" />
    <circle cx="40" cy="42" r="3" fill="#ea580c" />
    <circle cx="70" cy="44" r="3" fill="#ea580c" />
    <circle cx="100" cy="48" r="3" fill="#ea580c" />

    <!-- Floating Comfort Badge -->
    <g transform="translate(80, -65)">
      <circle cx="0" cy="0" r="42" fill="url(#orangeGrad)" />
      <text x="0" y="-4" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" font-family="sans-serif">ALL-DAY</text>
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle" font-family="sans-serif">COMFORT</text>
    </g>

    <!-- Sparkle Elements -->
    <polygon points="-120,-60 -115,-50 -105,-45 -115,-40 -120,-30 -125,-40 -135,-45 -125,-50" fill="#fde047" />
    <polygon points="120,60 124,66 130,70 124,74 120,80 116,74 110,70 116,66" fill="#f97316" />
  </g>
</svg>