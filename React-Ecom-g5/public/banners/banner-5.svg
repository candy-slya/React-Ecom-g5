<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg5)" rx="24" />

  <circle cx="950" cy="200" r="180" fill="#f59e0b" opacity="0.35" filter="url(#glow5)" />
  <circle cx="780" cy="360" r="140" fill="#d97706" opacity="0.3" filter="url(#glow5)" />
  <circle cx="200" cy="120" r="120" fill="#92400e" opacity="0.35" filter="url(#glow5)" />

  <!-- Diagonal dynamic lines -->
  <path d="M 600 -20 L 1250 -20 L 1050 500 L 400 500 Z" fill="#ffffff" opacity="0.04" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#amberGrad)" />
    <text x="90" y="22" fill="#78350f" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">FLASH DEALS ⚡</text>

    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Weekend Mega Sale</text>
    <text x="0" y="135" fill="url(#amberGrad)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Crazy Low Prices!</text>

    <text x="0" y="180" fill="#fde68a" font-size="16" font-family="system-ui, -apple-system, sans-serif">Special discounts across all categories. Grab your favorite items before stocks end!</text>

    <rect x="0" y="215" width="170" height="46" rx="8" fill="#ffffff" />
    <text x="85" y="244" fill="#78350f" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">GRAB OFFERS →</text>
  </g>

  <!-- Right Visual Graphics -->
  <g transform="translate(900, 240)">
    <!-- Big Lightning Bolt -->
    <path d="M 10 -90 L -40 10 L 15 10 L -25 90 L 50 -15 L -5 -15 Z" fill="url(#amberGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#fde68a" stroke-width="2" stroke-dasharray="4 8" opacity="0.6" />

    <!-- Discount Ribbon -->
    <g transform="translate(70, -65)">
      <circle cx="0" cy="0" r="42" fill="#ef4444" />
      <text x="0" y="-4" fill="#ffffff" font-size="12" font-weight="900" text-anchor="middle" font-family="sans-serif">UP TO</text>
      <text x="0" y="16" fill="#ffffff" font-size="19" font-weight="900" text-anchor="middle" font-family="sans-serif">70%</text>
    </g>
  </g>
</svg>
