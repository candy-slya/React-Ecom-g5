<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgElectronics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="techCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowElectronics" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgElectronics)" rx="24" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="200" r="190" fill="#06b6d4" opacity="0.3" filter="url(#glowElectronics)" />
  <circle cx="780" cy="380" r="140" fill="#6366f1" opacity="0.3" filter="url(#glowElectronics)" />
  <circle cx="200" cy="110" r="130" fill="#3b82f6" opacity="0.2" filter="url(#glowElectronics)" />

  <!-- High-Tech Circuit Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.2">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="165" height="34" rx="17" fill="url(#neonGlow)" />
    <text x="82" y="22" fill="#ffffff" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SMART TECH</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Flagship Electronics</text>
    <text x="0" y="135" fill="url(#techCyan)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">&amp; Smart Devices</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif">Experience cutting-edge smartphones, ultra-thin laptops, and intelligent devices.</text>

    <!-- Shop Now Button -->
    <rect x="0" y="215" width="165" height="46" rx="10" fill="#ffffff" />
    <text x="82" y="244" fill="#020617" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SHOP NOW →</text>
  </g>

  <!-- Right Visual Graphics: Modern Phone & Laptop Device Silhouettes -->
  <g transform="translate(890, 240)">
    <!-- Tech Wave Aura -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.35" />
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.03" />

    <!-- Laptop Mockup in Background -->
    <g transform="translate(-40, 15)">
      <!-- Screen Lid -->
      <rect x="-90" y="-85" width="180" height="115" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <rect x="-82" y="-77" width="164" height="99" rx="6" fill="#0f172a" />
      <!-- Laptop Screen Glow Line -->
      <line x1="-60" y1="-25" x2="60" y2="-25" stroke="#38bdf8" stroke-width="3" opacity="0.7" />
      <!-- Base Keyboard Chassis -->
      <path d="M -115 30 L 115 30 L 100 45 L -100 45 Z" fill="#334155" />
    </g>

    <!-- Smartphone Mockup in Foreground -->
    <g transform="translate(60, -10)">
      <rect x="-45" y="-95" width="90" height="175" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <rect x="-38" y="-87" width="76" height="159" rx="14" fill="url(#techCyan)" opacity="0.85" />
      <!-- Dynamic Wallpaper Wave -->
      <path d="M -30 20 Q 0 -30 30 20" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" />
      <circle cx="0" cy="-65" r="4" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Floating Tech Performance Badge -->
    <g transform="translate(90, -70)">
      <circle cx="0" cy="0" r="40" fill="url(#neonGlow)" />
      <text x="0" y="-3" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle" font-family="sans-serif">TOP</text>
      <text x="0" y="13" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" font-family="sans-serif">PERFORMANCE</text>
    </g>

    <!-- Tech Sparks -->
    <polygon points="-115,-70 -110,-60 -100,-55 -110,-50 -115,-40 -120,-50 -130,-55 -120,-60" fill="#38bdf8" />
  </g>
</svg>