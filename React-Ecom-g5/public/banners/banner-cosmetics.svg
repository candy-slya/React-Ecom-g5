<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCosmetics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="roseBeauty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glowCosmetics" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgCosmetics)" rx="24" />

  <!-- Ambient Glow -->
  <circle cx="970" cy="200" r="190" fill="#2dd4bf" opacity="0.3" filter="url(#glowCosmetics)" />
  <circle cx="780" cy="370" r="150" fill="#34d399" opacity="0.25" filter="url(#glowCosmetics)" />
  <circle cx="210" cy="130" r="140" fill="#14b8a6" opacity="0.2" filter="url(#glowCosmetics)" />

  <!-- Botanical Leaf Background Accents -->
  <g opacity="0.06" fill="#ffffff">
    <ellipse cx="640" cy="90" rx="90" ry="160" transform="rotate(35 640 90)" />
    <ellipse cx="780" cy="70" rx="80" ry="140" transform="rotate(-25 780 70)" />
    <ellipse cx="1120" cy="390" rx="100" ry="170" transform="rotate(-40 1120 390)" />
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="url(#mintGlow)" />
    <text x="90" y="22" fill="#042f2e" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">GLOW &amp; BEAUTY</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Pure Cosmetics</text>
    <text x="0" y="135" fill="url(#mintGlow)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">&amp; Skin Essentials</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#ccfbf1" font-size="16" font-family="system-ui, -apple-system, sans-serif">Nourish your skin with gentle formulas, organic beauty, and daily skincare.</text>

    <!-- Shop Now Button -->
    <rect x="0" y="215" width="165" height="46" rx="10" fill="#ffffff" />
    <text x="82" y="244" fill="#0f766e" font-size="14" font-weight="900" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SHOP NOW →</text>
  </g>

  <!-- Right Visual Graphics: Skincare Bottles & Essence Droplet -->
  <g transform="translate(890, 240)">
    <!-- Glow aura rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 6" opacity="0.45" />
    <circle cx="0" cy="0" r="105" fill="#ffffff" opacity="0.04" />

    <!-- Serum Dropper Bottle Silhouette -->
    <rect x="-42" y="-75" width="84" height="150" rx="22" fill="#f0fdfa" opacity="0.95" />
    <!-- Dropper Neck & Cap -->
    <rect x="-22" y="-110" width="44" height="35" rx="6" fill="#14b8a6" />
    <rect x="-12" y="-126" width="24" height="16" rx="3" fill="#0d9488" />
    
    <!-- Luminous Serum Droplet Icon -->
    <path d="M 0 -15 C 18 10, 20 30, 0 38 C -20 30, -18 10, 0 -15 Z" fill="#2dd4bf" opacity="0.8" />
    
    <!-- Small Cosmetic Cream Jar on the side -->
    <g transform="translate(68, 42)">
      <rect x="-30" y="-15" width="60" height="40" rx="8" fill="#ccfbf1" opacity="0.9" />
      <rect x="-32" y="-23" width="64" height="10" rx="4" fill="#0f766e" />
    </g>

    <!-- Floating Authenticity Badge -->
    <g transform="translate(78, -65)">
      <circle cx="0" cy="0" r="40" fill="url(#mintGlow)" />
      <text x="0" y="-3" fill="#042f2e" font-size="11" font-weight="900" text-anchor="middle" font-family="sans-serif">100%</text>
      <text x="0" y="13" fill="#042f2e" font-size="12" font-weight="900" text-anchor="middle" font-family="sans-serif">AUTHENTIC</text>
    </g>

    <!-- Botanical Leaf -->
    <path d="M -70 50 Q -95 10 -60 -10 Q -40 20 -70 50 Z" fill="#34d399" opacity="0.75" />
  </g>
</svg>