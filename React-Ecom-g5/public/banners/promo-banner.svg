<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="promoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="650" fill="url(#promoBg)" rx="24" />

  <!-- Ambient glow shapes -->
  <circle cx="480" cy="180" r="160" fill="#0284c7" opacity="0.4" filter="url(#pGlow)" />
  <circle cx="120" cy="520" r="180" fill="#f59e0b" opacity="0.25" filter="url(#pGlow)" />
  <circle cx="300" cy="300" r="120" fill="#ec4899" opacity="0.2" filter="url(#pGlow)" />

  <!-- Geometric elements -->
  <circle cx="300" cy="220" r="170" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.15" />
  <circle cx="300" cy="220" r="130" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1" />

  <!-- Modern 3D isometric gift / product highlight illustration -->
  <g transform="translate(300, 210)">
    <!-- 3D Box look -->
    <polygon points="0,-75 90,-25 0,25 -90,-25" fill="url(#boxTop)" opacity="0.95" />
    <polygon points="-90,-25 0,25 0,115 -90,65" fill="#0284c7" />
    <polygon points="90,-25 0,25 0,115 90,65" fill="#0369a1" />
    <!-- Ribbon lines -->
    <path d="M 0 -75 L 0 25 L 0 115" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />
    <path d="M -90 -25 L 0 25 L 90 -25" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" />

    <!-- Sparkles / Stars -->
    <polygon points="120,-70 126,-58 138,-52 126,-46 120,-34 114,-46 102,-52 114,-58" fill="#fde047" />
    <polygon points="-120,60 -115,68 -107,72 -115,76 -120,84 -125,76 -133,72 -125,68" fill="#fde047" />
    <polygon points="110,80 114,86 122,89 114,92 110,98 106,92 98,89 106,86" fill="#38bdf8" />
  </g>
</svg>
