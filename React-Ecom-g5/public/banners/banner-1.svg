<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClothing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
    <filter id="glowClothing" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgClothing)" rx="24" />

  <!-- Ambient Glow Circles -->
  <circle cx="960" cy="210" r="190" fill="#a855f7" opacity="0.3" filter="url(#glowClothing)" />
  <circle cx="780" cy="360" r="150" fill="#ec4899" opacity="0.25" filter="url(#glowClothing)" />
  <circle cx="220" cy="120" r="140" fill="#6366f1" opacity="0.2" filter="url(#glowClothing)" />

  <!-- Diagonal Accent Shapes -->
  <path d="M 680 -50 L 1280 -50 L 1080 550 L 480 550 Z" fill="#ffffff" opacity="0.03" />
  <path d="M 820 -50 L 1320 -50 L 1220 550 L 720 550 Z" fill="#ffffff" opacity="0.02" />

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="url(#roseAccent)" />
    <text x="85" y="22" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">NEW COLLECTION</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Trendy Clothing</text>
    <text x="0" y="135" fill="url(#purpleGrad)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">&amp; Casual Fashion</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#cbd5e1" font-size="16" font-family="system-ui, -apple-system, sans-serif">Discover stylish apparel, everyday casual wear, and premium garments.</text>

    <!-- Shop Now Button -->
    <rect x="0" y="215" width="165" height="46" rx="10" fill="#ffffff" />
    <text x="82" y="244" fill="#0f172a" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SHOP NOW →</text>
  </g>

  <!-- Right Visual Graphics: Stylish Apparel & Hanger Silhouette -->
  <g transform="translate(900, 240)">
    <circle cx="0" cy="0" r="145" fill="#ffffff" opacity="0.05" />
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.08" />

    <!-- Coat Hanger Graphic -->
    <path d="M 0 -85 C 15 -85, 20 -105, 5 -105 C -10 -105, -5 -85, 0 -70 L 75 -25 C 80 -20, 75 -15, 65 -15 L -65 -15 C -75 -15, -80 -20, -75 -25 Z" fill="#f43f5e" opacity="0.95" />
    
    <!-- Garment Silhouette (Modern Jacket / Hoodie) -->
    <path d="M -75 -15 L -105 50 L -70 65 L -55 20 L -55 115 L 55 115 L 55 20 L 70 65 L 105 50 L 75 -15 L 25 -15 L 0 15 L -25 -15 Z" fill="#e0e7ff" opacity="0.9" />
    <path d="M -25 -15 L 0 15 L 25 -15" stroke="#4338ca" stroke-width="4" fill="none" stroke-linejoin="round" />
    <line x1="0" y1="15" x2="0" y2="115" stroke="#4338ca" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Shopping Bag Accent -->
    <g transform="translate(65, 45)">
      <rect x="-35" y="-30" width="70" height="65" rx="8" fill="#fda4af" />
      <path d="M -16 -30 C -16 -50, 16 -50, 16 -30" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Floating Quality Badge -->
    <g transform="translate(85, -65)">
      <circle cx="0" cy="0" r="42" fill="url(#roseAccent)" />
      <text x="0" y="-4" fill="#ffffff" font-size="11" font-weight="900" text-anchor="middle" font-family="sans-serif">ORIGINAL</text>
      <text x="0" y="14" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle" font-family="sans-serif">STYLE</text>
    </g>

    <!-- Sparkling Stars -->
    <polygon points="120,-80 125,-70 135,-65 125,-60 120,-50 115,-60 105,-65 115,-70" fill="#facc15" />
    <polygon points="-125,75 -121,81 -115,85 -121,89 -125,95 -129,89 -135,85 -129,81" fill="#38bdf8" />
  </g>
</svg>