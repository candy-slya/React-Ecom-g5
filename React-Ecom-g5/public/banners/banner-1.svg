<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg1)" rx="24" />

  <!-- Ambient Glow Circles -->
  <circle cx="950" cy="200" r="180" fill="#ec4899" opacity="0.35" filter="url(#glow1)" />
  <circle cx="800" cy="380" r="140" fill="#3b82f6" opacity="0.3" filter="url(#glow1)" />
  <circle cx="200" cy="100" r="120" fill="#6366f1" opacity="0.2" filter="url(#glow1)" />

  <!-- Grid Accent Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Left Text Content -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="34" rx="17" fill="url(#accent1)" />
    <text x="85" y="22" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SPECIAL PROMO</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Super Tech &amp; Gadgets</text>
    <text x="0" y="135" fill="url(#cyanGrad)" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif">Up to 40% OFF</text>

    <!-- Subtitle -->
    <text x="0" y="180" fill="#cbd5e1" font-size="16" font-family="system-ui, -apple-system, sans-serif">Explore the latest smartphones, smart accessories and electronics.</text>

    <!-- Button -->
    <rect x="0" y="215" width="160" height="46" rx="8" fill="#ffffff" />
    <text x="80" y="244" fill="#0f172a" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SHOP NOW →</text>
  </g>

  <!-- Right Visual Graphics -->
  <g transform="translate(850, 240)">
    <!-- Central Device Mockup Silhouette -->
    <rect x="-100" y="-120" width="200" height="240" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <rect x="-85" y="-105" width="170" height="210" rx="20" fill="url(#cyanGrad)" opacity="0.85" />
    <!-- Screen Content / Waves -->
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.25" />
    <path d="M -40 30 Q 0 -20 40 30" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="0" cy="-60" r="6" fill="#ffffff" opacity="0.8" />

    <!-- Floating Badge -->
    <g transform="translate(70, -60)">
      <circle cx="0" cy="0" r="38" fill="url(#accent1)" />
      <text x="0" y="-4" fill="#ffffff" font-size="13" font-weight="900" text-anchor="middle" font-family="sans-serif">SAVE</text>
      <text x="0" y="14" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">40%</text>
    </g>

    <!-- Decorative Stars/Crosses -->
    <polygon points="120,-80 125,-70 135,-65 125,-60 120,-50 115,-60 105,-65 115,-70" fill="#facc15" />
    <polygon points="-130,80 -126,86 -120,90 -126,94 -130,100 -134,94 -140,90 -134,86" fill="#38bdf8" />
  </g>
</svg>
